[package]
name = "remote-bridge-hub"
version = "1.5.6"
description = "Voice VibeCoding — 语音氛围编程 / 小米·T1·V60 遥控器桥接 (Rust)"
authors = ["Voice VibeCoding"]
edition = "2021"

[lib]
name = "remote_bridge_hub_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
parking_lot = "0.12"
xz2 = "0.1"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

# Windows APIs for BLE, HID, keyboard hooks
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Bluetooth_Advertisement",
    "Devices_Enumeration",
    "Devices_HumanInterfaceDevice",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_Security",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_IO",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
] }
hidapi = "2.6"
cpal = "0.15"
winreg = "0.52"

# For audio resampling
rubato = "0.14"

[profile.dev]
opt-level = 1
incremental = false

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
